<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예약 확인</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { font-family: "Malgun Gothic", sans-serif; background: transparent; }
      button { font: inherit; -webkit-app-region: no-drag; }
      .overlay-button {
        width: 100%; height: 100%; padding: 0 1.5vw;
        display: flex; align-items: center; gap: 1.2vw;
        border: 0; border-radius: 12px;
        color: #fff; background: linear-gradient(110deg, #ce2454, #b71150);
        cursor: pointer; user-select: none; text-align: left;
      }
      .overlay-button:hover { background: #b71150; }
      .overlay-button:active { background: #980b40; }
      .overlay-button:focus-visible { outline: 3px solid #fff; outline-offset: -5px; }
      .calendar { width: 4.5vw; height: 4.5vw; min-width: 36px; min-height: 36px; max-width: 64px; max-height: 64px; flex: none; }
      .title { font-size: clamp(26px, 2.8vw, 48px); font-weight: 800; white-space: nowrap; }
      .copy { display: flex; flex-direction: column; gap: 3px; white-space: nowrap; }
      .copy strong { font-size: clamp(16px, 1.5vw, 26px); }
      .copy small { font-size: clamp(12px, 1.05vw, 18px); }
      .platforms { margin-left: auto; display: flex; align-items: center; gap: 0.55vw; }
      .platforms span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: clamp(10px, 0.85vw, 15px); font-weight: 700; white-space: nowrap; }
      .platforms img { width: clamp(28px, 3.35vw, 58px); height: clamp(28px, 3.35vw, 58px); border-radius: 10px; object-fit: cover; }
      .arrow { flex: none; margin-left: auto; width: 4.2vw; height: 4.2vw; min-width: 36px; min-height: 36px; max-width: 68px; max-height: 68px; padding: 1vw; border-radius: 50%; color: #b71150; background: #fff; }
      @media (max-width: 1100px) { .copy small { display: none; } .copy strong { font-size: 16px; } }
      @media (max-width: 900px) { .copy { display: none; } .platforms span { font-size: 10px; } }
      @media (max-width: 690px) { .platforms { display: none; } .copy { display: flex; } }
      @media (max-height: 70px) { .platforms span { font-size: 0; gap: 0; } .platforms img { width: 30px; height: 30px; } }
      .compact .overlay-button { flex-direction: column; justify-content: center; gap: 4px; padding: 8px; background: #e66c00; }
      .compact .calendar { width: 36px; height: 36px; min-width: 0; min-height: 0; }
      .compact .title { font-size: 26px; }
      .compact .copy, .compact .platforms, .compact .arrow { display: none; }
    </style>
  </head>
  <body>
    <button class="overlay-button" id="overlayBtn" type="button" aria-label="예약 확인 — 예약 조회 및 체크인">
      <svg class="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2M8 18h2"/></svg>
      <strong class="title">예약 확인</strong>
      <span class="copy"><strong>예약 조회 · 체크인</strong><small>예약하신 고객님은 먼저 예약을 확인해 주세요.</small></span>
      <span class="platforms" aria-hidden="true">
        <span><img src="../public/booking-channels/yanolja.jpg" alt=""/>야놀자</span>
        <span><img src="../public/booking-channels/yeogi.jpg" alt=""/>여기어때</span>
        <span><img src="../public/booking-channels/naver.jpg" alt=""/>네이버예약</span>
        <span><img src="../public/booking-channels/agoda.jpg" alt=""/>아고다</span>
        <span><img src="../public/booking-channels/gmarket.jpg" alt=""/>G마켓</span>
        <span><img src="../public/booking-channels/kakaotalk.jpg" alt=""/>카카오톡</span>
        <span><img src="../public/booking-channels/coupang.jpg" alt=""/>쿠팡</span>
        <span><img src="../public/booking-channels/honeystay.jpg" alt=""/>꿀스테이</span>
        <span><img src="../public/booking-channels/airbnb.jpg" alt=""/>에어비앤비</span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </button>
    <script>
      document.body.classList.toggle("compact", new URLSearchParams(location.search).get("layout") !== "banner")
      document.getElementById("overlayBtn").addEventListener("click", () => {
        window.electronAPI?.send("overlay-button-clicked")
      })
    </script>
  </body>
</html>
